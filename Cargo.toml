[package]
name = "espn-fantasy-football"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An asynchronous, typed ESPN fantasy football reader"
license = "MIT"
exclude = ["reference/**"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 0.6.5 uses let chains requiring Rust 1.88, including when building examples.
wiremock = "=0.6.4"
